<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil - Réseau Social</title>
    <!-- Chargement des feuilles de style imposées par l'architecture -->
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/profil.css">
    <!-- Bibliothèque d'icônes pour le design style Facebook -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>

    <div class="profile-container">
        
        <!-- EN-TÊTE DU PROFIL (Design à la Facebook) -->
        <header class="profile-header">
            <!-- Couverture (Non stockée en BD, gérée via une image générique ou statique) -->
            <div class="cover-section">
                <img id="cover-img" src="../../assets/images/default-cover.jpg" alt="Couverture">
                <button class="btn-edit-cover"><i class="fas fa-camera"></i> Modifier la photo de couverture</button>
            </div>

            <!-- Barre d'avatar et informations principales (Données de la table 'users') -->
            <div class="header-avatar-bar">
                <div class="avatar-info-wrapper">
                    <!-- Photo de profil basée sur la colonne 'avatar' de ta BD -->
                    <div class="profile-avatar-container">
                        <img id="user-avatar" src="../../assets/images/default.png" alt="Photo de profil">
                        <label for="upload-avatar" class="avatar-upload-btn">
                            <i class="fas fa-camera"></i>
                        </label>
                    </div>
                    <div class="user-text-details">
                        <!-- Nom et Prénom combinés issus de la table 'users' -->
                        <h1 id="profile-full-name">Chargement...</h1>
                        <!-- Compteur calculé sur la table 'friends' avec statut 'accepted' -->
                        <p id="profile-friend-count" class="text-muted">0 ami(s)</p>
                    </div>
                </div>

                <!-- Zone d'action dynamique (Ajouter, Accepter, Retirer ou Éditer) -->
                <div class="header-actions" id="profile-actions-zone">
                    <!-- Généré dynamiquement en JS selon le statut de la table 'friends' -->
                </div>
            </div>

            <!-- Onglets de navigation de la SPA (Sans rechargement de page) -->
            <nav class="profile-tabs">
                <button class="tab-btn active" data-target="feed-section">Publications</button>
                <button class="tab-btn" data-target="about-section">À propos</button>
                <button class="tab-btn" data-target="friends-section">Amis</button>
                <button class="tab-btn" id="settings-tab-btn" data-target="settings-section">Paramètres</button>
            </nav>
        </header>

        <!-- DISPOSITION DU CONTENU (Système à 2 Colonnes) -->
        <main class="profile-content-layout">
            
            <!-- COLONNE GAUCHE : Cartes d'informations fixes -->
            <aside class="left-sidebar">
                <!-- Bloc Présentation / Intro -->
                <div class="profile-card">
                    <h3>Intro</h3>
                    <div class="info-list">
                        <p><i class="fas fa-envelope"></i> <span id="intro-email">...</span></p>
                        <!-- Utilise la colonne 'created_at' de la table 'users' -->
                        <p><i class="fas fa-calendar-alt"></i> Membre depuis le <span id="intro-date">...</span></p>
                        <!-- Utilise la colonne 'role' de la table 'users' -->
                        <p><i class="fas fa-user-shield"></i> Statut : <span id="intro-role" class="badge-role">...</span></p>
                    </div>
                </div>

                <!-- Bloc Aperçu des Amis (Grille 3x3 Facebook) -->
                <div class="profile-card">
                    <div class="card-header-link">
                        <h3>Amis</h3>
                        <a href="#" class="view-all-tabs" data-target="friends-section">Voir tous les amis</a>
                    </div>
                    <!-- Conteneur pour injecter un aperçu visuel des amis -->
                    <div class="friends-grid-preview" id="friends-preview-container">
                        <!-- Rempli par assets/js/friends.js via l'API friends -->
                    </div>
                </div>
            </aside>

            <!-- COLONNE DROITE : Flux et formulaires dynamiques -->
            <section class="main-profile-stream">
                
                <!-- SECTION 1 : PUBLICATIONS (Tables 'posts', 'likes', 'comments') -->
                <div id="feed-section" class="tab-content active">
                    <!-- Zone de création rapide (Invisible si on visite le profil d'un autre utilisateur) -->
                    <div class="profile-card create-post-card" id="my-profile-post-creator">
                        <div class="create-post-upper">
                            <img class="mini-avatar src-user-avatar" src="../../assets/images/default.png" alt="Avatar">
                            <button id="trigger-post-modal">Exprimez-vous...</button>
                        </div>
                    </div>

                    <!-- Flux des publications de cet utilisateur précis -->
                    <div id="user-posts-container">
                        <!-- Les posts, compteurs de likes et commentaires seront injectés ici -->
                    </div>
                </div>

                <!-- SECTION 2 : À PROPOS (Table 'users' complète) -->
                <div id="about-section" class="tab-content">
                    <div class="profile-card">
                        <h3>Informations personnelles</h3>
                        <div class="about-details">
                            <p><strong>Nom :</strong> <span id="about-lastname"></span></p>
                            <p><strong>Prénom :</strong> <span id="about-firstname"></span></p>
                            <p><strong>Adresse Email :</strong> <span id="about-mail"></span></p>
                            <p><strong>Type de compte :</strong> <span id="about-role"></span></p>
                            <p><strong>Identifiant Unique (ID) :</strong> #<span id="about-id"></span></p>
                        </div>
                    </div>
                </div>

                <!-- SECTION 3 : AMIS (Table 'friends' liée aux profils de 'users') -->
                <div id="friends-section" class="tab-content">
                    <div class="profile-card">
                        <h3>Liste complète des amis</h3>
                        <div class="friends-full-list" id="friends-full-container">
                            <!-- Liste gérée par api/friends/list.php et injectée en AJAX -->
                        </div>
                    </div>
                </div>

                <!-- SECTION 4 : PARAMÈTRES (Pour les actions du Jour 3 de Ya) -->
                <div id="settings-section" class="tab-content">
                    <!-- Formulaire aligné sur api/friends/profile_edit.php -->
                    <div class="profile-card">
                        <h3>Modifier mes informations</h3>
                        <form id="form-edit-profile" enctype="multipart/form-data">
                            <div class="form-group">
                                <label for="edit-prenom">Prénom</label>
                                <input type="text" name="prenom" id="edit-firstname" required>
                            </div>
                            <div class="form-group">
                                <label for="edit-nom">Nom</label>
                                <input type="text" name="nom" id="edit-lastname" required>
                            </div>
                            <div class="form-group">
                                <label>Nouvelle photo de profil</label>
                                <!-- Input d'upload lié à la colonne 'avatar' de la BD -->
                                <input type="file" name="avatar" id="upload-avatar-file" accept="image/*">
                            </div>
                            <button type="submit" class="btn-primary">Mettre à jour le profil</button>
                        </form>
                    </div>

                    <!-- Formulaire aligné sur api/friends/change_password.php -->
                    <div class="profile-card">
                        <h3>Sécurité du compte</h3>
                        <form id="form-change-password">
                            <div class="form-group">
                                <label>Mot de passe actuel</label>
                                <input type="password" name="old_password" required>
                            </div>
                            <div class="form-group">
                                <label>Nouveau mot de passe (8 caractères minimum)</label>
                                <input type="password" name="new_password" minlength="8" required>
                            </div>
                            <button type="submit" class="btn-secondary">Changer le mot de passe</button>
                        </form>
                    </div>
                </div>

            </section>
        </main>
    </div>

    <!-- Liaisons des scripts obligatoires selon la feuille de route -->
    <script src="../../assets/js/friends.js"></script>
    <script src="../../assets/js/profil.js"></script>
</body>
</html>
