<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profil Agora</title>
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/profil.css" />
  <!-- Chargement asynchrone et optimisé du script -->
  <script src="../assets/js/profil.js" defer></script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" aria-label="Navigation principale">
    <span class="navbar__brand">Agoral</span>
    <div class="navbar__nav">
      <a href="./feed.html">Accueil</a>
      <a href="./amis.html">Amis</a>
      <a href="./chat.html">Chat</a>
      <a href="./profil.html" class="active" aria-current="page">Profil</a>
    </div>
    <div class="navbar__right">
      <div class="navbar__user">
        <img id="nav-avatar" src="../assets/images/default-avatar.png" alt="Mon avatar" />
        <span id="nav-nom">—</span>
      </div>
    </div>
  </nav>

  <!-- contenu -->
  <main class="layout">
    <div class="card">

      <!-- infos -->
      <div class="profile-banner"></div>
      <div class="profile-meta">
        <div class="avatar-wrap">
          <img id="profile-avatar" src="../assets/images/default-avatar.png" alt="Photo de profil" />
          <label class="avatar-change" for="quick-avatar-input" title="Changer la photo"></label>
          <input type="file" id="quick-avatar-input" accept="image/jpeg,image/png,image/gif" />
        </div>
        <div class="profile-info">
          <p class="profile-info__name" id="profile-fullname">Chargement…</p>
          <p class="profile-info__email" id="profile-email"></p>
          <span class="profile-info__role" id="profile-role">user</span>
        </div>
      </div>

      <!-- Onglets -->
      <div class="tabs" role="tablist" aria-label="Options du profil">
        <button class="tab-btn active" data-tab="infos" role="tab" aria-selected="true" aria-controls="tab-infos">Informations</button>
        <button class="tab-btn" data-tab="avatar" role="tab" aria-selected="false" aria-controls="tab-avatar">Photo de profil</button>
        <button class="tab-btn" data-tab="password" role="tab" aria-selected="false" aria-controls="tab-password">Mot de passe</button>
      </div>

      <!--Informations personnelles -->
      <div id="tab-infos" class="tab-panel active" role="tabpanel" aria-label="Informations personnelles">
        <form id="form-profil">
          <div class="form-grid">

            <div class="form-group">
              <label for="nom">Nom</label>
              <input type="text" id="nom" name="nom" placeholder="Votre nom" required maxlength="60" autocomplete="family-name" />
            </div>

            <div class="form-group">
              <label for="prenom">Prénom</label>
              <input type="text" id="prenom" name="prenom" placeholder="Votre prénom" required maxlength="60" autocomplete="given-name" />
            </div>

            <div class="form-group full">
              <label for="email">Adresse e-mail</label>
              <input type="email" id="email" name="email" placeholder="exemple@domaine.com" required autocomplete="email" />
            </div>

            <div class="form-group full">
              <label for="bio">Bio</label>
              <textarea id="bio" name="bio" placeholder="Parlez un peu de vous…" maxlength="300"></textarea>
            </div>

            <div class="form-group">
              <label for="ville">Ville</label>
              <input type="text" id="ville" name="ville" placeholder="Votre ville" maxlength="80" autocomplete="address-level2" />
            </div>

            <div class="form-group">
              <label for="telephone">Téléphone</label>
              <input type="tel" id="telephone" name="telephone" placeholder="+229 …" maxlength="20" autocomplete="tel" />
            </div>

          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-secondary" id="btn-cancel-infos">Annuler</button>
            <button type="submit" class="btn btn-primary" id="btn-save-infos">Enregistrer</button>
          </div>
        </form>
      </div>

      <!--  Photo de profil -->
      <div id="tab-avatar" class="tab-panel" role="tabpanel" aria-label="Photo de profil">
        <div class="avatar-preview-zone">
          <img id="avatar-preview" src="../assets/images/default-avatar.png" alt="Aperçu de la nouvelle photo" />
          <div class="hint">
            <strong>Photo de profil</strong>
          </div>
        </div>
        <div class="form-group">
          <label for="avatar-file">Choisir une image</label>
          <input type="file" id="avatar-file" accept="image/jpeg,image/png,image/gif" />
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-primary" id="btn-save-avatar">Mettre à jour la photo</button>
        </div>
      </div>

      <!-- modifier le mot de passe -->
      <div id="tab-password" class="tab-panel" role="tabpanel" aria-label="Modification du mot de passe">
        <form id="form-password">
          <div class="form-grid">

            <div class="form-group full">
              <label for="current-pass">Mot de passe actuel</label>
              <input type="password" id="current-pass" name="current_password" placeholder="••••••••" required autocomplete="current-password" />
            </div>

            <div class="form-group">
              <label for="new-pass">Nouveau mot de passe</label>
              <input type="password" id="new-pass" name="new_password" placeholder="Entrez votre nouveau mot de passe" required minlength="8" autocomplete="new-password" />
              <div class="strength-bar">
                <div class="strength-fill" id="strength-fill"></div>
              </div>
              <span class="strength-hint" id="strength-hint"></span>
            </div>

            <div class="form-group">
              <label for="confirm-pass">Confirmer le mot de passe</label>
              <input type="password" id="confirm-pass" name="confirm_password" placeholder="Répétez le mot de passe" required minlength="8" autocomplete="new-password" />
            </div>

          </div>
          <div class="form-actions">
            <button type="reset" class="btn btn-secondary">Annuler</button>
            <button type="submit" class="btn btn-primary" id="btn-save-pass">Changer le mot de passe</button>
          </div>
        </form>
      </div>
    </div>
    
    <button class="btn-logout" id="btn-logout">Déconnexion</button>
  </main>

  <!-- Toast pour les notifications -->
  <div id="toast" role="alert" aria-live="assertive" aria-atomic="true"></div>
  
  <script src="../assets/js/profil.js"></script>
</body>
</html>
