<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Connexion</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
        }

        .login-header {
            background: #1A56A0;
            padding: 30px;
            text-align: center;
        }

        .login-header h1 {
            color: #fff;
            font-size: 22px;
            margin-bottom: 5px;
        }

        .login-header p {
            color: #a8c8f0;
            font-size: 13px;
        }

        .login-body {
            padding: 35px 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border 0.3s;
        }

        .form-group input:focus {
            border-color: #1A56A0;
        }

        .btn-login {
            width: 100%;
            padding: 13px;
            background: #1A56A0;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-login:hover {
            background: #154a8a;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            text-align: center;
            display: none;
        }

        .message.error {
            background: #fde8e8;
            color: #c0392b;
            display: block;
        }

        .message.success {
            background: #e8f5e9;
            color: #27ae60;
            display: block;
        }

        .login-footer {
            text-align: center;
            padding: 15px;
            font-size: 12px;
            color: #aaa;
            border-top: 1px solid #f0f0f0;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-header">
        <h1> Espace Admin</h1>
        <p>Réseau Social — Panneau d'administration</p>
    </div>

    <div class="login-body">
        <div class="form-group">
            <label for="email">Adresse email</label>
            <input type="email" id="email" placeholder="admin@exemple.com" />
        </div>

        <div class="form-group">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" placeholder="••••••••" />
        </div>

        <button class="btn-login" onclick="adminLogin()">Se connecter</button>

        <div class="message" id="message"></div>
    </div>

    <div class="login-footer">
        Réseau Social &copy; 2026 — Accès réservé aux administrateurs
    </div>
</div>

<script>
    async function adminLogin() {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const msg = document.getElementById('message');

        msg.className = 'message';
        msg.textContent = '';

        if (!email || !password) {
            msg.className = 'message error';
            msg.textContent = 'Veuillez remplir tous les champs.';
            return;
        }

        try {
            const response = await fetch('../../api/admin/login.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (data.success) {
                sessionStorage.setItem('rss_admin', JSON.stringify(data.user));
                msg.className = 'message success';
                msg.textContent = 'Connexion réussie ! Redirection...';
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
            } else {
                msg.className = 'message error';
                msg.textContent = data.message || 'Identifiants incorrects.';
            }

        } catch (err) {
            msg.className = 'message error';
            msg.textContent = 'Erreur de connexion au serveur.';
        }
    }

    // Connexion avec la touche Entrée
    document.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') adminLogin();
    });
</script>

</body>
</html>
