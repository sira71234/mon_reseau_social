<div class="container auth-container">
    <h1>Vérification du compte</h1>
    <p>Entrez le code à 6 chiffres reçu par email.</p>
    <div id="message"></div>
    <form id="verifyForm">
        <input type="hidden" id="verifyEmail" name="email">
        <label for="code">Code de vérification :</label>
        <input type="text" id="code" name="code" maxlength="6" placeholder="000000" required><br><br>
        <button type="submit">Vérifier</button>
    </form>
</div>
