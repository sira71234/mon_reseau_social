<div class="feed-layout">
    <aside class="sidebar-left">
        <div class="container" id="profileInfo"></div>
    </aside>

    <main class="feed-main">
        <div class="container">
            <h2>Nouvelle publication</h2>
            <div id="message"></div>
            <form id="postForm">
                <textarea id="postContent" placeholder="Quoi de neuf ?" required rows="3" style="width:100%"></textarea><br><br>
                <input type="file" id="postImage" accept="image/*"><br><br>
                <button type="submit">Publier</button>
            </form>
        </div>

        <div id="postsList"></div>
    </main>
</div>
