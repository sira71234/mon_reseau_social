<nav id="navbar">
    <div class="container">
        <h1>Agora</h1>
        <input type="text" placeholder="Rechercher...">
        <div id="nav-profil">
            <span>Mon profil</span>
        </div>
    </div>
</nav>

<main class="container feed-layout">
    <aside id="sidebar-gauche">
        <div class="card" id="profileInfo"></div>
    </aside>

    <section id="flux">
        <div class="card" id="creer-post">
            <div id="message"></div>
            <form id="postForm">
                <textarea id="postContent" placeholder="Quoi de neuf ?" required rows="3" style="width:100%"></textarea><br><br>
                <input type="file" id="postImage" accept="image/*"><br><br>
                <button type="submit" class="btn btn-primary">Publier</button>
            </form>
        </div>
        <div id="postsList"></div>
    </section>

    <aside id="sidebar-droite">
        <div class="card">
            <h3>Suggestions d'amis</h3>
            <div id="liste-suggestions"></div>
        </div>
    </aside>
</main>
