    <div class="container">
        <h1>Connexion</h1>
        <p>Bienvenue sur Agora ! Connectez-vous à votre compte.</p>
        <div id="message"></div>
        <form id="loginForm">
            <label for="email">Email :</label>
            <input type="email" id="email" name="email" required><br><br>
            <label for="password">Mot de passe :</label>
            <input type="password" id="password" name="password" required><br><br>
            <input type="submit" value="Se connecter">
        </form>
        <a id="toRegister" href="#">Je n'ai pas de compte</a>
        <a id="toReset" href="#">Mot de passe oublié</a>
    </div>
