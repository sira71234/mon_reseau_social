<div class="container">
    <h1>Mon profil</h1>
    <div id="profilMessage"></div>

    <div class="profil-header" style="display:flex;align-items:center;gap:20px;margin-bottom:20px">
        <img id="profilAvatar" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='100' height='100'%3E%3Crect width='100' height='100' fill='%23cccccc'/%3E%3Ctext x='50' y='62' font-size='40' text-anchor='middle' fill='%23ffffff'%3E%3F%3C/text%3E%3C/svg%3E" alt="Photo de profil" style="width:100px;height:100px;border-radius:50%;object-fit:cover;border:1px solid #ddd;background:#eee">
        <div>
            <p><strong id="profilNomComplet"></strong></p>
            <p id="profilEmail" style="color:#666"></p>
            <p><span id="profilNbAmis">0</span> ami(s) &middot; <span id="profilNbPosts">0</span> publication(s)</p>
        </div>
    </div>

    <!-- Boutons qui affichent/masquent chaque section au clic -->
    <div class="profil-actions" style="display:flex;gap:10px;margin-bottom:20px">
        <button type="button" id="btnToggleInfo" onclick="toggleProfilSection('infoSection', 'btnToggleInfo')">Modifier mes informations</button>
        <button type="button" id="btnTogglePassword" onclick="toggleProfilSection('passwordSection', 'btnTogglePassword')">Changer mon mot de passe</button>
    </div>

    <div id="infoSection" class="profil-section" style="display:none;border:1px solid #ddd;border-radius:8px;padding:15px;margin-bottom:15px">
        <h2>Modifier mes informations</h2>
        <form id="profilInfoForm">
            <label for="avatarInput">Photo de profil</label><br>
            <input type="file" id="avatarInput" accept="image/*"><br><br>

            <label for="editUsername">Nom</label><br>
            <input type="text" id="editUsername" required><br><br>

            <label for="editSurname">Prénom</label><br>
            <input type="text" id="editSurname" required><br><br>

            <label for="editBirthdate">Date de naissance</label><br>
            <input type="date" id="editBirthdate"><br><br>

            <label>Genre</label><br>
            <input type="radio" id="edit_gender_male" name="editGender" value="male"> <label for="edit_gender_male">Homme</label>
            <input type="radio" id="edit_gender_female" name="editGender" value="female"> <label for="edit_gender_female">Femme</label>
            <input type="radio" id="edit_gender_not_specified" name="editGender" value="not specified"> <label for="edit_gender_not_specified">Ne pas spécifier</label>
            <input type="radio" id="edit_gender_other" name="editGender" value="other"> <label for="edit_gender_other">Autre</label>
            <br><br>

            <label for="editNum">Numéro de téléphone</label><br>
            <input type="text" id="editNum"><br><br>

            <button type="submit">Enregistrer les modifications</button>
        </form>
    </div>

    <div id="passwordSection" class="profil-section" style="display:none;border:1px solid #ddd;border-radius:8px;padding:15px;margin-bottom:15px">
        <h2>Changer mon mot de passe</h2>
        <div id="passwordMessage"></div>
        <form id="passwordForm">
            <label for="currentPassword">Mot de passe actuel</label><br>
            <input type="password" id="currentPassword" required><br><br>

            <label for="newPassword">Nouveau mot de passe</label><br>
            <input type="password" id="newPassword" minlength="8" required><br><br>

            <label for="confirmPassword">Confirmer le nouveau mot de passe</label><br>
            <input type="password" id="confirmPassword" minlength="8" required><br><br>

            <button type="submit">Changer le mot de passe</button>
        </form>
    </div>
</div>
