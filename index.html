<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agora</title>
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
    <nav id="navbar" style="display:none">
        <a href="#" onclick="loadView('vues/clients/feed.html')">Accueil</a>
        <a href="#" onclick="loadView('vues/clients/profil.html')">Profil</a>
        <a href="#" onclick="loadView('vues/clients/amis.html')">Amis</a>
        <a href="#" onclick="loadView('vues/clients/chat.html')">Chat</a>
        <a href="#" onclick="logout()">Déconnexion</a>
    </nav>

    <div id="app"></div>

    <script src="assets/js/auth.js"></script>
    <script src="assets/js/feed.js"></script>
    <script src="assets/js/friends.js"></script>
    <script>
        function loadView(url) {
            fetch(url)
            .then(res => {
                if (!res.ok) throw new Error('Vue introuvable');
                return res.text();
            })
            .then(html => {
                document.getElementById('app').innerHTML = html;
                if (typeof initForms === 'function') initForms();
                if (typeof initFeed === 'function') initFeed();
                if (typeof initFriends === 'function') initFriends();
            })
            .catch(() => {
                document.getElementById('app').innerHTML = '<div class="container"><h1>Page introuvable</h1></div>';
            });
        }

        const params = new URLSearchParams(window.location.search);
        const user = sessionStorage.getItem('rss_user');

        if (params.has('token')) {
            loadView('vues/clients/new_password.html');
            document.getElementById('navbar').style.display = 'none';
        } else if (!user) {
            loadView('vues/clients/login.html');
            document.getElementById('navbar').style.display = 'none';
        } else {
            loadView('vues/clients/feed.html');
            document.getElementById('navbar').style.display = 'block';
        }
    </script>
</body>
</html>
